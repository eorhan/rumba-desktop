name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-targets: ""
            args: "--bundles nsis"
            glob: "src-tauri/target/release/bundle/nsis/*-setup.exe"
            name: windows
          - os: macos-latest
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles dmg"
            glob: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg"
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      # Both platforms ship unsigned (no code-signing certificate); users bypass SmartScreen /
      # Gatekeeper on first launch. There is no self-updater (it tripped Smart App Control), so the
      # app only checks a server manifest and shows a non-forced "new version" banner.
      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumba-${{ matrix.name }}
          path: ${{ matrix.glob }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.glob }}
