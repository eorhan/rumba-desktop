[package]
name = "rumba"
version = "1.0.8"
description = "Rumba — sesli sohbet ve mesajlaşma"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde_json = "1"
# Lightweight running-process listing for game detection (we only read process names).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# Small, fast binary: the app is only a thin shell around the system WebView2.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
